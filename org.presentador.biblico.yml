id: org.presentador.biblico
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: presentador-biblico

finish-args:
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.freedesktop.portal.Background

modules:
  - name: tcl
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tcl8.6.15-src.tar.gz
        sha256: 861e159753f2e2fbd6ec1484103715b0be56be3357522b858d3cbb5f893ffef1
    subdir: unix
    post-install:
      - chmod 755 /app/lib/libtcl8.6.so

  - name: tk
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tk8.6.15-src.tar.gz
        sha256: 550969f35379f952b3020f3ab7b9dd5bfd11c1ef7c9b7c6a75f5c49aca793fec
    subdir: unix
    post-install:
      - chmod 755 /app/lib/libtk8.6.so

  - name: python3-tkinter
    buildsystem: simple
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.13.2/Python-3.13.2.tar.xz
        sha256: d984bcc57cd67caab26f7def42e523b1c015bbc5dc07836cf4f0b63fa159eb56
    build-commands:
      - ./configure --prefix=/app --with-tcltk-includes="-I/app/include" --with-tcltk-libs="-L/app/lib -ltcl8.6 -ltk8.6"
      - make -j$(nproc)
      - mkdir -p /app/lib/python3.13/site-packages
      - install -Dm755 build/lib.linux-*/_tkinter*.so /app/lib/python3.13/site-packages/
      - cp -r Lib/tkinter /app/lib/python3.13/site-packages/

  - name: python3-pillow
    buildsystem: simple
    sources:
      - type: archive
        url: https://github.com/python-pillow/Pillow/archive/refs/tags/11.1.0.tar.gz
        sha256: 1e63499468dc069a31ea0226b531be1c1c31b185b80616f8707066aba599db12
    build-commands:
      - pip3 install --no-build-isolation --no-deps --prefix=/app .

  - name: presentador-biblico
    buildsystem: simple
    sources:
      - type: dir
        path: .
    build-commands:
      - mkdir -p /app/bin
      - mkdir -p /app/share/presentador-biblico
      - mkdir -p /app/share/fonts
      - mkdir -p /app/share/icons/hicolor/512x512/apps
      - mkdir -p /app/share/applications
      - cp -r bin modulos data assets /app/share/presentador-biblico/
      - cp assets/fonts/*.ttf /app/share/fonts/
      - fc-cache -f -v /app/share/fonts
      - echo '#!/bin/sh' > /app/bin/presentador-biblico
      - echo 'export XDG_DATA_DIRS=/app/share:${XDG_DATA_DIRS:-/usr/local/share:/usr/share}' >> /app/bin/presentador-biblico
      - echo 'export FONTCONFIG_PATH=/etc/fonts' >> /app/bin/presentador-biblico
      - echo 'export PYTHONIOENCODING=utf-8' >> /app/bin/presentador-biblico
      - echo 'cd /app/share/presentador-biblico && exec python3 bin/PresentadorBiblicoV2.py "$@"' >> /app/bin/presentador-biblico
      - chmod +x /app/bin/presentador-biblico
      - install -Dm644 assets/org.presentador.biblico.png /app/share/icons/hicolor/512x512/apps/org.presentador.biblico.png
      - install -Dm644 org.presentador.biblico.desktop /app/share/applications/org.presentador.biblico.desktop
